name: Deploy Godot Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.3.0
        use-dotnet: false
        include-templates: true

    - name: Verify Project
      run: |
        cd client-godot
        godot --headless --check-only --quit

    - name: Export Web
      run: |
        cd client-godot
        mkdir -p exports/web
        godot --headless --export-release "Web" exports/web/index.html

    - name: Patch web export for GitHub Pages
      run: |
        # Godot 4.3 exports a no-thread web build here, so GitHub Pages does not
        # need the COOP/COEP service-worker workaround. Keep the exported HTML in
        # plain mode to avoid service-worker reload/caching issues on Pages.
        sed -i 's|"ensureCrossOriginIsolationHeaders":true|"ensureCrossOriginIsolationHeaders":false|' \
          client-godot/exports/web/index.html

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: client-godot/exports/web

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
